<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilm Aura Quran</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f2;
      color: #183d32;
    }
    header {
      background: #183d32;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }
    .search-box {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000010;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #b18a45;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #result { margin-top: 18px; line-height: 1.6; }
    footer { text-align: center; padding: 20px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Ilm Aura Quran</h1>
    <p>Quran aur Islami taleem ki maloomat ka markaz</p>
  </header>

  <main>
    <div class="search-box">
      <h2>Apna sawal likhein</h2>
      <p>Quran, tafseer ya Dr. Israr Ahmed ke dars ke bare mein poochhein.</p>
      <input id="question" type="text"
        placeholder="Misal: Surah Al-Fatiha ki tafseer">
      <button onclick="searchQuestion()">Search</button>
      <div id="result"></div>
    </div>
  </main>

  <footer>Ilm Aura Quran · Taleem aur maloomat ke liye</footer>

  <script>
    function searchQuestion() {
      const q = document.getElementById("question").value.trim();
      const result = document.getElementById("result");

      if (!q) {
        result.textContent = "Pehle apna sawal likhein.";
        return;
      }

      result.textContent =
        "Aapka sawal: " + q +
        ". Lecture library abhi tayyar ki ja rahi hai.";
    }
  </script>
</body>
</html>
